# Local Docker deployment: the same two processes the launchd agents run, as
# containers built from this checkout. `scripts/docsearch-up` is the whole
# operator interface -- it rebuilds and recreates in one command, and Docker
# recreates a container only when its image digest actually changed, so running
# it after a merge that touched nothing is a no-op.
#
#   scripts/docsearch-up          rebuild and roll forward
#   scripts/docsearch-up --logs   the same, then follow the logs
#
# Replaces deploy/launchd/*.plist on this machine. The plists and the systemd
# units stay in the repo; the code does not know which supervisor it is under.
name: docsearch

# Build through `scripts/docsearch-up`, not `docker compose up --build` by hand.
# The script exports BUILDX_NO_DEFAULT_ATTESTATIONS=1, and that is what makes a
# no-change rebuild a genuine no-op: buildx stamps its default provenance
# attestation with the build time, so an all-cache-hit rebuild still exports a
# new manifest digest and compose recreates the container believing the image
# changed. The compose-spec `build.provenance: false` field does NOT fix this --
# compose renders it as the string "false" and buildx does not act on it
# (verified against Compose v5.3.1). The environment variable does.

# The library is bind-mounted at the SAME absolute path it has on the host, and
# --root is that same path. That is load-bearing, not cosmetic: add_document
# takes a filesystem path from the MCP client, which is a process on the host,
# and the server validates it against --root. Mounting the library at /library
# instead would reject every path a client can actually name.
#
# Set DOCSEARCH_LIBRARY to move it; the path must be identical on both sides of
# every colon below, or add_document starts rejecting valid paths.

services:
  # The database every library lives in, on the image that ships
  # pg_textsearch with the library preloaded. Nothing in this repository
  # installs the extension: CREATE EXTENSION is superuser-only, so the
  # cluster does it, which is what initdb/00-roles.sql is.
  db:
    image: timescale/timescaledb-ha:pg17
    environment:
      POSTGRES_PASSWORD: docsearch
    volumes:
      - pgdata:/home/postgres/pgdata
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Named database and role, because the default entrypoint answers
      # ready on the bootstrap database before initdb has run.
      test: ["CMD-SHELL", "pg_isready -U docsearch_owner -d docsearch"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  # Migration runs here and nowhere else, for the same reason the systemd unit
  # runs it from ExecStartPre: the worker is the only writer, so this is the
  # one point in the lifecycle where a schema change races nothing. Idempotent,
  # so it is free on the restarts that need no migration.
  #
  # A migration that cannot be applied exits nonzero, and because both real
  # services gate on service_completed_successfully, neither ever starts. That
  # is the intended outcome: serving through a schema the code does not match
  # is worse than not serving.
  migrate:
    build:
      context: ../..
      dockerfile: Dockerfile.worker
    image: docsearch-worker:local
    entrypoint: ["docsearch"]
    command: ["migrate"]
    environment:
      DOCSEARCH_DSN: postgres://docsearch_owner:docsearch@db:5432/docsearch?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  server:
    build:
      context: ../..
      dockerfile: Dockerfile.server
    image: docsearch-server:local
    # 0.0.0.0 is the container's network namespace, not the host's. The
    # published port below binds host loopback only, so nothing outside this
    # machine can reach it -- but the server cannot know that, hence the
    # explicit --allow-public-bind and the warning it logs at startup.
    command:
      - --root=${DOCSEARCH_LIBRARY:-$HOME/Documents/docsearch-library}
      - --addr=0.0.0.0:8765
      - --allow-public-bind
      - --allowed-origins=https://claude.ai,https://app.claude.ai
    # Requests run as the restricted role, never as the owner the migrations
    # ran under: policies bind the owner too, but a request has no business
    # holding the privileges that can change a table.
    environment:
      DOCSEARCH_DSN: postgres://docsearch_app:docsearch@db:5432/docsearch?sslmode=disable
    # The token stays in its 0600 file and never enters this world-readable
    # compose file, matching what the launchd wrapper did with `set -a`.
    env_file:
      - ${HOME}/.config/docsearch/token.env
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      # The server only validates paths; it never reads document bytes.
      - ${DOCSEARCH_LIBRARY:-$HOME/Documents/docsearch-library}:${DOCSEARCH_LIBRARY:-$HOME/Documents/docsearch-library}:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    build:
      context: ../..
      dockerfile: Dockerfile.worker
    image: docsearch-worker:local
    command: ["--root", "${DOCSEARCH_LIBRARY:-$HOME/Documents/docsearch-library}"]
    environment:
      DOCSEARCH_DSN: postgres://docsearch_app:docsearch@db:5432/docsearch?sslmode=disable
      # One worker serves one library. A deployment with accounts runs one
      # per user, or a worker that loops over them, which phase 04 does not
      # need and so does not build.
      DOCSEARCH_USER: default
    volumes:
      # Read-write: the worker is what actually opens the documents.
      - ${DOCSEARCH_LIBRARY:-$HOME/Documents/docsearch-library}:${DOCSEARCH_LIBRARY:-$HOME/Documents/docsearch-library}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # The worker checkpoints or rolls back its partial rows on SIGTERM. A large
    # scanned PDF can sit inside one unit of work for minutes, so give it the
    # same room the launchd ExitTimeOut and the Pod grace period give it.
    stop_grace_period: 900s
    restart: unless-stopped

volumes:
  # A Docker-managed volume, not a bind mount: a database wants real file
  # locking, and locking over the macOS virtiofs bind-mount path is not
  # something to bet one on. This lives on ext4 inside the Linux VM.
  pgdata:
