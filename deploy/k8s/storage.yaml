# The document library. RWO, so it attaches to one node and both containers
# of the Pod share it.
#
# The database is not here. Postgres is operated by the cluster, with its own
# storage and its own backups; docs/plans/postgres-multiuser.md says which
# three statements need privileges docsearch does not have.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: docsearch-library
spec:
  accessModes: ["ReadWriteOnce"]
  volumeMode: Filesystem
  storageClassName: ceph-rbd
  resources:
    requests:
      storage: 50Gi
