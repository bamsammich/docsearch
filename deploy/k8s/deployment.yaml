apiVersion: apps/v1
kind: Deployment
metadata:
  name: docsearch
  labels: { app.kubernetes.io/name: docsearch }
spec:
  # One replica, because one worker serves one library and a second would
  # claim the same queue. FOR UPDATE SKIP LOCKED makes two workers safe, so
  # raising this is a decision about ingest throughput rather than a
  # correctness question the database leaves open.
  replicas: 1
  strategy:
    # Recreate while the Pod holds the library volume read-write: an RWO
    # claim attaches to one node, so a rolling update would deadlock waiting
    # for the old Pod to let go.
    type: Recreate
  selector:
    matchLabels: { app.kubernetes.io/name: docsearch }
  template:
    metadata:
      labels: { app.kubernetes.io/name: docsearch }
    spec:
      # Long enough for an in-flight ingest to reach a checkpoint and roll back
      # its partial rows rather than being killed mid-write.
      terminationGracePeriodSeconds: 900
      securityContext:
        runAsNonRoot: true
        fsGroup: 65532
        seccompProfile: { type: RuntimeDefault }

      # Migration runs to completion before either container starts, as the
      # same idempotent command the systemd unit runs from ExecStartPre.
      #
      # Running it here rather than inside the worker removes the startup
      # race: the server's readiness probe asserts the schema version, and
      # without this it can assert against a database nothing has migrated
      # yet, flapping the Pod until the worker happens to win.
      #
      # It connects as the owning role, which is the only one that may change
      # a table. The cluster creates both roles, the database and the
      # extension; docs/plans/postgres-multiuser.md says why none of the
      # three is something docsearch can do for itself.
      #
      # A migration that cannot be applied exits nonzero, the init container
      # backs off and retries, and the Pod never reaches Ready. That is the
      # intended outcome: serving through a schema the code does not match is
      # worse than not serving.
      initContainers:
        - name: migrate
          image: ghcr.io/bamsammich/docsearch-worker:latest
          command: ["docsearch", "migrate"]
          env:
            - name: DOCSEARCH_DSN
              valueFrom: { secretKeyRef: { name: docsearch-db, key: ownerDSN } }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }

      containers:
        # Both containers are in ONE Pod because they share the library
        # volume. An RWO claim attaches to a single node, so they must be
        # co-located; separate Deployments could not both mount it. The
        # database is no longer a reason: it is reachable over the network.
        - name: server
          image: ghcr.io/bamsammich/docsearch-server:latest
          args:
            - --root=/library
            - --addr=$(DOCSEARCH_ADDR)
            - --allowed-origins=$(DOCSEARCH_ALLOWED_ORIGINS)
          env:
            - name: DOCSEARCH_ADDR
              valueFrom: { configMapKeyRef: { name: docsearch-config, key: addr } }
            - name: DOCSEARCH_ALLOWED_ORIGINS
              valueFrom: { configMapKeyRef: { name: docsearch-config, key: allowedOrigins } }
            - name: DOCSEARCH_TOKEN
              valueFrom: { secretKeyRef: { name: docsearch-token, key: token } }
            # The restricted role, never the owner: a request has no business
            # holding privileges that can change a table.
            - name: DOCSEARCH_DSN
              valueFrom: { secretKeyRef: { name: docsearch-db, key: appDSN } }
          ports:
            - { name: mcp, containerPort: 8765 }
          volumeMounts:
            # The server only validates paths; it never reads document bytes.
            - { name: library, mountPath: /library, readOnly: true }
          livenessProbe:
            httpGet: { path: /healthz, port: mcp }
            periodSeconds: 20
          readinessProbe:
            # Fails on a schema-version mismatch, so a server deployed against
            # a database it was not built for is pulled from service instead of
            # answering wrongly.
            httpGet: { path: /readyz, port: mcp }
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }

        - name: worker
          image: ghcr.io/bamsammich/docsearch-worker:latest
          args: ["--root=/library"]
          env:
            - name: DOCSEARCH_DSN
              valueFrom: { secretKeyRef: { name: docsearch-db, key: appDSN } }
            # One worker serves one library. A deployment with accounts runs
            # one per user, which phase 04 does not need and so does not
            # build.
            - name: DOCSEARCH_USER
              value: default
          volumeMounts:
            # Read-write: the worker is what actually opens the documents.
            - { name: library, mountPath: /library }
            - { name: tmp, mountPath: /tmp }
          resources:
            # Extraction saturates a core for minutes at a time. No CPU limit:
            # throttling an OCR pass turns a ten-minute job into an hour.
            requests: { cpu: 500m, memory: 512Mi }
            limits: { memory: 4Gi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }

      volumes:
        - name: library
          persistentVolumeClaim: { claimName: docsearch-library }
        - name: tmp
          emptyDir: {}
