version: "2"
sql:
  - engine: "postgresql"
    # The migrations are the schema: sqlc replays them in order, reading
    # goose's annotations, so a query is typed against the shape a migrated
    # database actually has, partitions and row-level security included.
    schema: "internal/schema/migrations/postgres"
    queries: "internal/pgstore/query"
    gen:
      go:
        package: "pgdbgen"
        out: "internal/pgstore/pgdbgen"
        emit_empty_slices: true
