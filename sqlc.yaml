version: "2"
sql:
  - engine: "sqlite"
    # The schema itself, not a copy of it. docsearch.db reads the same file to
    # create databases, and the Go store tests build their index from it.
    schema: "python/docsearch/schema.sql"
    queries: "internal/store/query"
    gen:
      go:
        package: "dbgen"
        out: "internal/store/dbgen"
        emit_empty_slices: true
