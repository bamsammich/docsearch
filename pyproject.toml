[project]
name = "docsearch"
version = "0.1.0"
description = "Structure-aware document ingest for a local SQLite FTS5 search index"
requires-python = ">=3.13"
dependencies = [
    "pymupdf>=1.26",
    "beautifulsoup4>=4.13",
    "lxml>=5.3",
    "python-docx>=1.1",
    "click>=8.1",
]

[project.scripts]
docsearch = "docsearch.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.9",
    "mypy>=1.15",
    "types-beautifulsoup4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python/docsearch"]

[tool.ruff]
line-length = 100
src = ["python"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "python"
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["fitz", "docx", "docx.*"]
ignore_missing_imports = true

# click's command decorators are untyped upstream; every CLI entry point would
# otherwise be reported as untyped purely because it carries one.
[[tool.mypy.overrides]]
module = ["docsearch.cli"]
disallow_untyped_decorators = false

[tool.pytest.ini_options]
pythonpath = ["python"]
testpaths = ["tests"]
