[project]
name = "docsearch"
version = "0.1.0"
description = "Structure-aware document ingest for a local SQLite FTS5 search index"
requires-python = ">=3.13"
dependencies = [
    "pymupdf>=1.26",
    "beautifulsoup4>=4.13",
    "lxml>=5.3",
    "python-docx>=1.1",
    "click>=8.1",
]

[project.scripts]
docsearch = "docsearch.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.9",
    "mypy>=1.15",
    "types-beautifulsoup4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python/docsearch"]
# db.py reads schema.sql at import, so an installed wheel without it cannot
# open a database at all.
artifacts = ["python/docsearch/schema.sql"]

[tool.ruff]
line-length = 100
src = ["python"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "python"
explicit_package_bases = true

# PyMuPDF ships partial type information: the classes are annotated but many
# methods are not, so every call into it trips disallow_untyped_calls. Skipping
# the import treats the package as Any, which is what the old `fitz` alias got
# by having no stubs at all -- the strictness applies to this project's code,
# not to how well a third-party package is annotated.
[[tool.mypy.overrides]]
module = ["pymupdf", "pymupdf.*", "docx", "docx.*"]
ignore_missing_imports = true
follow_imports = "skip"

# click's command decorators are untyped upstream; every CLI entry point would
# otherwise be reported as untyped purely because it carries one.
[[tool.mypy.overrides]]
module = ["docsearch.cli"]
disallow_untyped_decorators = false

[tool.pytest.ini_options]
pythonpath = ["python"]
testpaths = ["tests"]
