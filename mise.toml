[tools]
python = "3.13"
uv = "0.11.2"
go = "1.26"
golangci-lint = "2.13.2"
sqlc = "1.31.1"
lefthook = "2.1.14"
mockery = "3.8.0"

# uv owns .venv entirely (`uv sync` / `uv run`); mise only supplies the
# python and uv binaries so the venv is built against a pinned interpreter.
[env]
DOCSEARCH_DB = "{{config_root}}/var/docsearch.db"
DOCSEARCH_ROOT = "{{config_root}}/var/library"

[tasks.setup]
description = "Install Python deps, Go modules and the git hooks"
run = [
  "uv sync",
  "go mod download",
  "lefthook install",
]

[tasks.check]
description = "Everything CI runs, before a push"
run = [
  # A fresh lint cache: a stale one reported no issues for a whole package
  # that CI then refused.
  "GOLANGCI_LINT_CACHE=$(mktemp -d) mise run lint",
  "go mod tidy -diff",
  "sqlc diff",
  # Mocks are generated and committed, so a port edited without regenerating
  # them would otherwise be caught by nothing until a test broke elsewhere.
  # Scoped to the mocks, since a pre-push run has the rest of the branch's
  # work in the tree beside it.
  "mockery && git diff --exit-code -- '**/mocks/*.go'",
  "mise run test",
]

[tasks.lint]
description = "Lint Python and Go"
run = [
  "uv run ruff check .",
  "uv run ruff format --check .",
  "uv run mypy python/docsearch",
  "golangci-lint run ./...",
]

[tasks.fmt]
description = "Format Python and Go"
run = [
  "uv run ruff format .",
  "uv run ruff check --fix .",
  "golangci-lint fmt ./...",
]

[tasks.generate]
description = "Regenerate the Go query layer and the service ports' mocks"
run = [
  "sqlc generate",
  "mockery",
]

[tasks.test]
description = "Run Python and Go unit tests"
run = [
  "uv run pytest -q",
  "go test ./...",
]

[tasks.build]
description = "Build the MCP server binary"
run = "go build -o bin/docsearch-mcp ./cmd/docsearch-mcp"
