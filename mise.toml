[tools]
go = "1.26"
golangci-lint = "2.13.2"
sqlc = "1.31.1"
lefthook = "2.1.14"
mockery = "3.8.0"
buf = "1.73.0"
protoc-gen-go = "1.36.12"
protoc-gen-connect-go = "1.21.0"

[env]
DOCSEARCH_DB = "{{config_root}}/var/docsearch.db"
DOCSEARCH_ROOT = "{{config_root}}/var/library"

[tasks.setup]
description = "Install Go modules and the git hooks"
run = [
  "go mod download",
  "lefthook install",
]

[tasks.check]
description = "Everything CI runs, before a push"
run = [
  # A fresh lint cache: a stale one reported no issues for a whole package
  # that CI then refused.
  "GOLANGCI_LINT_CACHE=$(mktemp -d) mise run lint",
  "go mod tidy -diff",
  "sqlc diff",
  "buf lint",
  "buf format --diff --exit-code",
  # Everything generated is regenerated and compared with what was there, so
  # a source edited without regenerating fails here rather than at a test
  # that breaks somewhere else.
  "scripts/generated-is-current.sh",
  "mise run test",
]

[tasks.lint]
description = "Lint Go"
run = ["golangci-lint run ./..."]

[tasks.fmt]
description = "Format Go"
run = ["golangci-lint fmt ./..."]

[tasks.generate]
description = "Regenerate the migrations, schema snapshot, query layer, mocks and proto output"
run = [
  # What the migrations add up to, for a reviewer rather than for the code.
  "go run ./scripts/schema-snapshot",
  "sqlc generate",
  "mockery",
  "buf generate",
]

[tasks.test]
description = "Run the Go tests"
run = ["go test ./..."]

[tasks.build]
description = "Build the server, worker and CLI binaries"
run = [
  "go build -o bin/docsearch-server ./cmd/docsearch-server",
  "go build -o bin/docsearch-worker ./cmd/docsearch-worker",
  "go build -o bin/docsearch ./cmd/docsearch",
]
