syntax = "proto3";

// Package docsearch.account.v1 is what a docsearch administrator does.
//
// An administrator sees every account, adds and removes password accounts,
// resets and unlocks them, and chooses who else administers. The role
// covers accounts and nothing else: an administrator reads a library only
// through a grant on it, like anyone.
package docsearch.account.v1;

import "google/protobuf/timestamp.proto";

// Account is one account as an administrator sees it.
message Account {
  // Username is empty for an account that has not signed in since
  // usernames were recorded.
  string username = 1;
  bool admin = 2;
  google.protobuf.Timestamp created_at = 3;
  // Password is true for an account that signs in with a docsearch
  // password, which an administrator can reset, unlock and remove.
  bool password = 4;
  // LockedUntil is set while failed sign-ins lock a password account.
  google.protobuf.Timestamp locked_until = 5;
}

// Setting is one sign-in setting the server's configuration holds.
message Setting {
  string label = 1;
  string value = 2;
  // Source is where the value came from: flag, environment, file or
  // default. It is empty for a rule the server keeps rather than one it is
  // configured with.
  string source = 3;
  // Where names the flag, the environment variable or the file the value
  // came from.
  string where = 4;
  // Key is the setting's key in docsearch.yaml.
  string key = 5;
  // Flag and env are the ways to set it: its command-line flag and its
  // environment variable.
  string flag = 6;
  string env = 7;
  // Name identifies the setting in an UpdateSignIn change.
  string name = 8;
  // Editable is true for a setting the library UI changes, unless the
  // environment or the command line sets it.
  bool editable = 9;
  // Boolean settings take true or false.
  bool boolean = 10;
  // Stored is the value the database keeps, which takes effect when the
  // server next starts for a setting nothing stronger sets. It is set only
  // when has_stored is.
  string stored = 11;
  bool has_stored = 12;
}

// Change is one setting's new value. An empty value takes the setting back
// to its default.
message Change {
  string name = 1;
  string value = 2;
}

message MeRequest {}

message MeResponse {
  string username = 1;
  bool admin = 2;
  // Auth is the sign-in mode: none, token, password or oidc.
  string auth = 3;
}

message ListRequest {}

message ListResponse {
  repeated Account accounts = 1;
  // AdminGroup is the provider group administrators come from, when the
  // deployment names one. Each sign-in then grants or removes the role, so
  // a change made here lasts only until that account next signs in.
  string admin_group = 2;
}

message AddRequest {
  string username = 1;
}

message AddResponse {
  // Password is the account's new password, shown once.
  string password = 1;
}

message ResetRequest {
  string username = 1;
}

message ResetResponse {
  // Password is the account's new password, shown once.
  string password = 1;
}

message UnlockRequest {
  string username = 1;
}

message UnlockResponse {}

message RemoveRequest {
  string username = 1;
}

message RemoveResponse {}

message SetAdminRequest {
  string username = 1;
  bool admin = 2;
}

message SetAdminResponse {}

message SignInRequest {}

message UpdateSignInRequest {
  repeated Change changes = 1;
}

message UpdateSignInResponse {
  // File is docsearch.yaml with the changes to settings it holds made, and
  // empty when the changes touched none. Those were not stored: the
  // operator deploys the file.
  string file = 1;
  // ChangedLines are the 1-based lines of file the changes touched.
  repeated int32 changed_lines = 2;
  // Saved is true when changes to settings the file does not hold were kept
  // in the database, to take effect when the server next starts.
  bool saved = 3;
}

message SignInResponse {
  repeated Setting settings = 1;
  // File is the docsearch.yaml the server read, and empty when it read
  // none.
  string file = 2;
}

// AccountService is the administrator's work. Every call but Me refuses
// anyone who is not an administrator with PermissionDenied.
service AccountService {
  // Me is the caller's own account, and whether it administers.
  rpc Me(MeRequest) returns (MeResponse) {}

  // List is every account.
  rpc List(ListRequest) returns (ListResponse) {}

  // Add creates a password account and its library. Password mode only.
  rpc Add(AddRequest) returns (AddResponse) {}

  // Reset gives a password account a new password and lifts any lock.
  rpc Reset(ResetRequest) returns (ResetResponse) {}

  // Unlock clears a password account's failed sign-ins.
  rpc Unlock(UnlockRequest) returns (UnlockResponse) {}

  // Remove ends a password account's sign-in and every token it holds. Its
  // libraries stay.
  rpc Remove(RemoveRequest) returns (RemoveResponse) {}

  // SetAdmin makes an account an administrator, or stops it being one. The
  // last administrator stays one.
  rpc SetAdmin(SetAdminRequest) returns (SetAdminResponse) {}

  // SignIn is how people sign in, as the server's configuration sets it.
  rpc SignIn(SignInRequest) returns (SignInResponse) {}

  // UpdateSignIn changes sign-in settings: one docsearch.yaml holds into an
  // updated file, and any other into the database.
  rpc UpdateSignIn(UpdateSignInRequest) returns (UpdateSignInResponse) {}
}
